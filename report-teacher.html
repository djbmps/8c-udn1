<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3d1f77">
<title>ใบสรุปผลรายห้องเรียน — ทักษะ 8C สพป.อุดรธานี เขต 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand-900:#2a1758; --brand-800:#3d1f77; --brand-700:#4c2a96;
  --brand-600:#5a2ea6; --brand-500:#7c5ad4; --brand-100:#f1eafd;
  --bar:#7c5ad4;
  --l1:#c03050; --l2:#d98c14; --l3:#1f96c2; --l4:#5a2ea6;
  --ok:#1e9d6b; --warn:#d98218; --bad:#c0392b;
  --ink-1:#171226; --ink-2:#4d465f; --ink-3:#7a7290;
  --bg:#f3f0fa; --card:#ffffff; --line:#e3dcf0; --soft:#f8f5fd; --grid:#efeaf8;
  --r-lg:18px; --r:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(58,31,110,.06), 0 4px 14px rgba(58,31,110,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --l1:#c0364f; --l2:#b8890a; --l3:#0f9fc9; --l4:#7a52cf;
    --bar:#8f6ddc; --brand-100:#241a45; --brand-500:#9d80e8; --brand-600:#8f6ddc;
    --ok:#3ec18c; --warn:#e6a23c; --bad:#e0685c;
    --ink-1:#f2eefb; --ink-2:#b9b0cf; --ink-3:#8d84a8;
    --bg:#0f0b1c; --card:#181329; --line:#2b2342; --soft:#1e1834; --grid:#241d3b;
    --sh-1:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.28);
  }
}
[data-theme=dark]{
  --l1:#c0364f; --l2:#b8890a; --l3:#0f9fc9; --l4:#7a52cf;
  --bar:#8f6ddc; --brand-100:#241a45; --brand-500:#9d80e8; --brand-600:#8f6ddc;
  --ok:#3ec18c; --warn:#e6a23c; --bad:#e0685c;
  --ink-1:#f2eefb; --ink-2:#b9b0cf; --ink-3:#8d84a8;
  --bg:#0f0b1c; --card:#181329; --line:#2b2342; --soft:#1e1834; --grid:#241d3b;
  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-1);
  font-family:'Sarabun',-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
a{color:var(--brand-600)}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-.16em}

/* ---------- แถบควบคุม (ไม่พิมพ์) ---------- */
.bar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1b2a6b,#4c2a96 55%,#8e2f83);
  color:#fff;padding:12px 18px;box-shadow:0 2px 14px rgba(30,15,70,.25)}
.bar .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.bar h1{margin:0;font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:8px;
  width:100%;line-height:1.35}
.bar h1 small{font-weight:500;opacity:.85;font-size:.8rem}
.f{display:flex;flex-direction:column;gap:4px;min-width:150px}
.f label{font-size:.74rem;opacity:.85}
.f select,.f input{font-family:inherit;font-size:.88rem;padding:8px 10px;border-radius:9px;
  border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;width:100%}
.f select option{color:#171226}
.btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-family:inherit;font-size:.86rem;font-weight:600;padding:9px 14px;border-radius:10px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.28)}
.btn.key{background:linear-gradient(135deg,#f0a12e,#e0692c);border-color:rgba(255,255,255,.4)}
.note{max-width:1120px;margin:14px auto 0;padding:0 18px;color:var(--ink-3);font-size:.86rem}

/* ---------- แผ่นรายงาน A4 ---------- */
.sheets{max-width:1120px;margin:18px auto 60px;padding:0 18px;display:flex;
  flex-direction:column;gap:26px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:26px 28px 22px;box-shadow:var(--sh-1)}
.sheet h2{margin:0;font-size:1.16rem;font-weight:800;letter-spacing:-.01em}
.sheet .sub{margin:2px 0 0;color:var(--ink-3);font-size:.86rem}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding-bottom:14px;border-bottom:2px solid var(--brand-600)}
.rhead .org{text-align:right;font-size:.8rem;color:var(--ink-3);line-height:1.5;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:8px 10px;margin:14px 0 0}
.meta span{background:var(--soft);border:1px solid var(--line);border-radius:99px;
  padding:4px 12px;font-size:.82rem;color:var(--ink-2)}
.meta span b{color:var(--ink-1)}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.kpi .k{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px}
.kpi .k .t{font-size:.76rem;color:var(--ink-3)}
.kpi .k .v{font-size:1.42rem;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .k .d{font-size:.76rem;color:var(--ink-3)}
.up{color:var(--ok)} .dn{color:var(--bad)}

.two{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;
  align-items:start;margin-top:18px}
h3.sec{margin:22px 0 8px;font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
h3.sec .n{background:var(--brand-600);color:#fff;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;font-size:.78rem;flex:0 0 auto}
p.cap{margin:0 0 10px;color:var(--ink-3);font-size:.84rem}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;
  font-variant-numeric:tabular-nums}
th{font-weight:700;color:var(--ink-2);background:var(--soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--soft)}
td.nm{display:flex;align-items:center;gap:7px}
td.nm i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.76rem;font-weight:700;color:#fff}
.lv1{background:var(--l1)} .lv2{background:var(--l2)} .lv3{background:var(--l3)} .lv4{background:var(--l4)}
.risk{font-weight:800}
.risk.hi{color:var(--bad)} .risk.mid{color:var(--warn)}

.target{display:grid;gap:10px}
.target .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.target .row .cnt{font-size:1.3rem;font-weight:800;color:var(--bad);min-width:56px;text-align:center;
  font-variant-numeric:tabular-nums}
.target .row .cnt small{display:block;font-size:.68rem;font-weight:600;color:var(--ink-3)}
.target .row .who b{font-size:.94rem}
.target .row .who div{font-size:.8rem;color:var(--ink-3)}
.target .row .pc{font-size:.9rem;font-weight:700;color:var(--ink-2)}

.plan{display:grid;gap:14px}
.plan .card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan .hd{background:var(--brand-100);padding:9px 14px;display:flex;justify-content:space-between;
  gap:12px;align-items:baseline;flex-wrap:wrap}
.plan .hd b{font-size:.95rem}
.plan .hd span{font-size:.8rem;color:var(--ink-2)}
.plan .bd{padding:12px 14px}
.plan .step{font-size:.85rem;color:var(--ink-2);background:var(--soft);border-left:3px solid var(--bar);
  padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:10px}
.plan .step b{color:var(--ink-1)}
.plan ul{margin:0;padding-left:20px}
.plan li{font-size:.86rem;margin-bottom:4px}
.plan .ext{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.plan .ext .t{font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}

.sign{display:grid;grid-template-columns:repeat(2,1fr);gap:40px;margin-top:26px;
  padding-top:8px;text-align:center;color:var(--ink-2);font-size:.85rem}
.sign .ln{margin:26px 12px 6px;border-top:1px dotted var(--ink-3)}
.foot{margin-top:16px;padding-top:10px;border-top:1px solid var(--grid);
  color:var(--ink-3);font-size:.74rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-lg);
  padding:40px 22px;text-align:center;color:var(--ink-3)}
.loading{text-align:center;padding:60px 20px;color:var(--ink-3)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand-500);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ กราฟ (ใช้ร่วมกันทั้งหน้าเขตและหน้าโรงเรียน) ============ */
.chtip{position:fixed;z-index:80;pointer-events:none;display:none;max-width:260px;
  background:var(--ink-1);color:var(--card);border-radius:10px;padding:8px 11px;
  font-size:.8rem;line-height:1.5;box-shadow:0 8px 24px rgba(20,10,40,.28)}
.chtip b{display:block;font-size:.85rem;margin-bottom:2px}
.chtip i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;font-style:normal}
.chtip .r{display:flex;justify-content:space-between;gap:14px}
.chtip .r span{opacity:.82}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1;fill:none}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--ink-3);font-size:10.5px;font-family:inherit}
.chart .lbl{fill:var(--ink-2);font-size:11.5px;font-weight:600;font-family:inherit}
.chart .val{fill:var(--ink-1);font-size:11.5px;font-weight:700;font-family:inherit}

/* เรดาร์ */
.radar .area{fill:var(--bar);fill-opacity:.16;stroke:var(--bar);stroke-width:2;
  stroke-linejoin:round;transition:d .4s ease}
.radar .dot{fill:var(--card);stroke:var(--bar);stroke-width:2.4}
.radar .hit{fill:transparent;cursor:pointer}
.radar .hit:hover + .dot,.radar .dot.on{fill:var(--bar)}
.radar .key{fill:var(--ink-2);font-size:11.5px;font-weight:700;font-family:inherit}
.radar .sub{fill:var(--ink-3);font-size:10px;font-family:inherit}
.radar .pin{paint-order:stroke;stroke-linejoin:round}

/* เส้นแนวโน้ม */
.linec .area{fill:url(#lg);stroke:none}
.linec .ln{fill:none;stroke:var(--bar);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linec .dot{fill:var(--card);stroke:var(--bar);stroke-width:2.4}
.linec .dot.big{fill:var(--bar)}
.linec .cross{stroke:var(--brand-500);stroke-width:1;opacity:0;stroke-dasharray:0}
.linec .band{fill:transparent;cursor:crosshair}
.linec .band:hover ~ .cross{opacity:.45}

/* แท่งกระจายสองทาง (Likert) */
.dv{display:grid;grid-template-columns:auto 1fr auto;gap:7px 12px;align-items:center}
.dv .nm{font-size:.85rem;color:var(--ink-2);text-align:right;white-space:nowrap;
  display:flex;align-items:center;gap:7px;justify-content:flex-end}
.dv .nm i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.dv .trk{position:relative;display:flex;height:26px}
.dv .trk::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;
  background:var(--line)}
.dv .side{flex:1 1 50%;display:flex;min-width:0;gap:2px}
.dv .side.l{justify-content:flex-end}
.dv .seg{height:100%;display:grid;place-items:center;color:#fff;font-size:.76rem;
  font-weight:700;overflow:hidden;transition:width .45s ease;cursor:pointer;min-width:0}
.dv .side.l .seg:first-child{border-radius:6px 0 0 6px}
.dv .side.r .seg:last-child{border-radius:0 6px 6px 0}
.dv .risk{font-size:.82rem;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.dv .risk.hi{color:var(--bad)}
.dvfoot{display:flex;justify-content:space-between;align-items:center;gap:14px;
  flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--grid)}
.lg{display:flex;gap:15px;flex-wrap:wrap;font-size:.81rem;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tbtn{background:none;border:1px solid var(--line);color:var(--ink-2);font-family:inherit;
  font-size:.79rem;padding:5px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--brand-500);color:var(--brand-600)}
.axcap{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-3);
  margin-top:6px;padding-left:0}

/* มิเตอร์ */
.meter{display:flex;flex-direction:column;gap:5px;min-width:180px}
.meter .tp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:.79rem;opacity:.88}
.meter .tp b{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.meter .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.24);overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:#fff;transition:width .5s ease}

@media(max-width:600px){
  .dv{grid-template-columns:auto 1fr;gap:6px 8px}
  .dv .risk{display:none}
  .dv .nm{max-width:104px;white-space:normal;line-height:1.25}
}

@media(max-width:820px){
  .two{grid-template-columns:1fr}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .sheet{padding:18px 16px}
}
@page{ size:A4 portrait; margin:11mm 10mm; }
@media print{
  .bar,.note{display:none!important}
  body{background:#fff;font-size:12.5px}
  .sheets{margin:0;padding:0;gap:0;max-width:none}
  .sheet{break-after:page;page-break-after:always;border:none;border-radius:0;
    box-shadow:none;padding:0 0 8mm}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  h3.sec,.plan .card,.target .row,.kpi,table{break-inside:avoid}
  .chart{max-width:330px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ============================================================
   ชุดกราฟ SVG — ใช้ร่วมกันทั้งหน้าเขตและหน้าโรงเรียน
   เลือกรูปแบบตามหน้าที่ของข้อมูล
     • เรดาร์        — รูปทรงจุดแข็ง/จุดอ่อน 8 ด้านพร้อมกัน
     • เส้นแนวโน้ม   — ค่าเฉลี่ยไล่ตามลำดับชั้น (ข้อมูลมีลำดับ)
     • แท่งสองทาง    — สัดส่วนระดับคุณภาพ แยกซ้าย(ต้องพัฒนา)/ขวา(ดี)
   ============================================================ */
const CH = (function () {
  const esc2 = s => String(s == null ? '' : s)
    .replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  const nf2 = n => Number(n || 0).toLocaleString('th-TH');

  /* ---------- ทูลทิป ---------- */
  var tipEl = null;
  function tipBox() {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'chtip'; document.body.appendChild(tipEl); }
    return tipEl;
  }
  function show(html, x, y) {
    const t = tipBox();
    t.innerHTML = html; t.style.display = 'block';
    const r = t.getBoundingClientRect();
    t.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width / 2)) + 'px';
    t.style.top = Math.max(8, y - r.height - 14) + 'px';
  }
  function hide() { if (tipEl) tipEl.style.display = 'none'; }
  function bind(root) {
    if (!root) return;
    root.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('pointermove', e => show(el.getAttribute('data-tip'), e.clientX, e.clientY));
      el.addEventListener('pointerenter', e => show(el.getAttribute('data-tip'), e.clientX, e.clientY));
      el.addEventListener('pointerleave', hide);
    });
    root.addEventListener('pointerleave', hide);
    addEventListener('scroll', hide, { passive: true });
  }

  /* ---------- 1) เรดาร์ 8 ด้าน ---------- */
  function radar(items, opt) {
    opt = opt || {};
    const max = opt.max || 4, n = items.length;
    const W = 430, H = 340, cx = W / 2, cy = H / 2 + 4, R = 108;
    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const px = (i, v) => cx + Math.cos(ang(i)) * R * (v / max);
    const py = (i, v) => cy + Math.sin(ang(i)) * R * (v / max);
    const ring = v => items.map((_, i) => px(i, v).toFixed(1) + ',' + py(i, v).toFixed(1)).join(' ');

    var best = 0, worst = 0;
    items.forEach((x, i) => { if (x.v > items[best].v) best = i; if (x.v < items[worst].v) worst = i; });

    var s = '<svg class="chart radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="เรดาร์คะแนนเฉลี่ยรายทักษะ 8 ด้าน เต็ม ' + max + '">';
    /* วงอ้างอิง 1–4 */
    for (var v = 1; v <= max; v++) s += '<polygon class="grid" points="' + ring(v) + '"/>';
    /* ก้าน */
    items.forEach(function (_, i) {
      s += '<line class="grid" x1="' + cx + '" y1="' + cy + '" x2="' + px(i, max).toFixed(1) +
        '" y2="' + py(i, max).toFixed(1) + '"/>';
    });
    /* ป้ายสเกลบนแกนบนสุด */
    for (var v2 = 1; v2 <= max; v2++) {
      s += '<text class="tick" x="' + (cx + 4) + '" y="' + (py(0, v2) + 3.5).toFixed(1) + '">' + v2 + '</text>';
    }
    /* พื้นที่ข้อมูล */
    s += '<polygon class="area" points="' + items.map((x, i) =>
      px(i, x.v).toFixed(1) + ',' + py(i, x.v).toFixed(1)).join(' ') + '"/>';

    /* จุด + พื้นที่รับเมาส์ + ป้ายแกน */
    items.forEach(function (x, i) {
      const X = px(i, x.v), Y = py(i, x.v);
      const tip = '<b>' + esc2(x.key) + ' · ' + esc2(x.label) + '</b>' +
        '<div class="r"><span>คะแนนเฉลี่ย</span><b>' + x.v.toFixed(2) + ' / ' + max.toFixed(2) + '</b></div>' +
        (x.extra ? '<div class="r"><span>' + esc2(x.extra[0]) + '</span><b>' + esc2(x.extra[1]) + '</b></div>' : '');
      s += '<circle class="hit" cx="' + X.toFixed(1) + '" cy="' + Y.toFixed(1) + '" r="16" data-tip="' + esc2(tip) + '"/>';
      s += '<circle class="dot" cx="' + X.toFixed(1) + '" cy="' + Y.toFixed(1) + '" r="4.6"/>';

      const LX = px(i, max) + Math.cos(ang(i)) * 30, LY = py(i, max) + Math.sin(ang(i)) * 30;
      const c = Math.cos(ang(i));
      const anchor = Math.abs(c) < 0.3 ? 'middle' : (c > 0 ? 'start' : 'end');
      s += '<text class="key" x="' + LX.toFixed(1) + '" y="' + (LY - 3).toFixed(1) + '" text-anchor="' + anchor + '">' +
        esc2(x.key) + '</text>';
      /* ชื่อย่อยาว ๆ ตัดเป็น 2 บรรทัด กันล้นออกนอกกรอบ */
      const sub = String(x.short || '');
      var l1 = sub, l2 = '';
      if (sub.length > 17) {
        var cut = sub.lastIndexOf(' ', Math.ceil(sub.length / 2) + 4);
        if (cut < 4) cut = sub.indexOf(' ', Math.ceil(sub.length / 2) - 4);
        if (cut > 3) { l1 = sub.slice(0, cut); l2 = sub.slice(cut + 1); }
      }
      s += '<text class="sub" x="' + LX.toFixed(1) + '" y="' + (LY + 9).toFixed(1) + '" text-anchor="' + anchor + '">' +
        esc2(l1) + (l2 ? '<tspan x="' + LX.toFixed(1) + '" dy="11">' + esc2(l2) + '</tspan>' : '') + '</text>';
    });

    /* ป้ายค่าเฉพาะจุดสูงสุด–ต่ำสุด (ไม่ติดป้ายทุกจุด) */
    [[best, 'สูงสุด'], [worst, 'ต่ำสุด']].forEach(function (pair) {
      const i = pair[0], x = items[i];
      const X = px(i, x.v), Y = py(i, x.v);
      const c = Math.cos(ang(i)), sn = Math.sin(ang(i));
      /* แกนบน–ล่างวางป้ายในแนวตั้ง ไม่ให้ทับตัวเลขสเกลกลางภาพ */
      var tx, ty, anc;
      if (Math.abs(c) < 0.35) { tx = X; ty = Y + (sn < 0 ? -11 : 16); anc = 'middle'; }
      else { tx = X + (c >= 0 ? 13 : -13); ty = Y + 4; anc = c >= 0 ? 'start' : 'end'; }
      s += '<text class="val pin" x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) +
        '" text-anchor="' + anc + '" stroke="var(--card)" stroke-width="3">' +
        x.v.toFixed(2) + '</text>';
    });
    s += '</svg>';
    return s;
  }

  /* ---------- 2) เส้นแนวโน้มตามลำดับชั้น ---------- */
  function trend(pts, opt) {
    opt = opt || {};
    const lo = opt.lo != null ? opt.lo : 1, hi = opt.hi != null ? opt.hi : 4;
    const W = 440, H = 290, PL = 30, PR = 14, PT = 16, PB = 44;
    const iw = W - PL - PR, ih = H - PT - PB;
    const n = pts.length;
    if (!n) return '';
    const X = i => PL + (n === 1 ? iw / 2 : i * iw / (n - 1));
    const Y = v => PT + ih - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * ih;

    var s = '<svg class="chart linec" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="แนวโน้มคะแนนเฉลี่ย 8C ตามระดับชั้น">' +
      '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--bar)" stop-opacity=".26"/>' +
      '<stop offset="100%" stop-color="var(--bar)" stop-opacity="0"/></linearGradient></defs>';

    for (var v = lo; v <= hi; v += (hi - lo) / 3) {
      const y = Y(v);
      s += '<line class="grid" x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text class="tick" x="' + (PL - 7) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        v.toFixed(1) + '</text>';
    }

    const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
    s += '<path class="area" d="' + line + ' L' + X(n - 1).toFixed(1) + ' ' + (PT + ih) +
      ' L' + X(0).toFixed(1) + ' ' + (PT + ih) + ' Z"/>';
    s += '<path class="ln" d="' + line + '"/>';

    var best = 0, worst = 0;
    pts.forEach((p, i) => { if (p.v > pts[best].v) best = i; if (p.v < pts[worst].v) worst = i; });

    pts.forEach(function (p, i) {
      const x = X(i), y = Y(p.v);
      const key = (i === 0 || i === n - 1 || i === best || i === worst);
      const tip = '<b>' + esc2(p.label) + '</b>' +
        '<div class="r"><span>คะแนนเฉลี่ย 8C</span><b>' + p.v.toFixed(2) + '</b></div>' +
        (p.n != null ? '<div class="r"><span>ห้องเรียน</span><b>' + nf2(p.n) + ' ห้อง</b></div>' : '') +
        (p.students != null ? '<div class="r"><span>นักเรียน</span><b>' + nf2(p.students) + ' คน</b></div>' : '');
      s += '<rect class="band" x="' + (x - iw / (2 * Math.max(1, n - 1))).toFixed(1) + '" y="' + PT +
        '" width="' + (iw / Math.max(1, n - 1)).toFixed(1) + '" height="' + ih + '" data-tip="' + esc2(tip) + '"/>';
      s += '<circle class="dot' + (key ? ' big' : '') + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
        '" r="' + (key ? 5 : 4) + '"/>';
      if (key) {
        s += '<text class="val" x="' + x.toFixed(1) + '" y="' + (y - 11).toFixed(1) +
          '" text-anchor="middle" stroke="var(--card)" stroke-width="3" paint-order="stroke">' +
          p.v.toFixed(2) + '</text>';
      }
      s += '<text class="tick" x="' + x.toFixed(1) + '" y="' + (PT + ih + 17) +
        '" text-anchor="middle">' + esc2(p.short || p.label) + '</text>';
      /* จำนวนห้อง: ซ่อนเมื่อชั้นเยอะจนป้ายทับกัน และสลับแสดงเว้นจุดเมื่อเริ่มแน่น */
      if (p.n != null && n <= 15 && (n <= 9 || i % 2 === 0)) {
        s += '<text class="tick" x="' + x.toFixed(1) + '" y="' + (PT + ih + 31) +
          '" text-anchor="middle" opacity=".72">' + p.n + ' ห้อง</text>';
      }
    });
    s += '</svg>';
    return s;
  }

  /* ---------- 3) แท่งกระจายสองทาง (ordered scale) ---------- */
  function diverging(rows, opt) {
    opt = opt || {};
    const names = opt.names || ['ระดับ 1', 'ระดับ 2', 'ระดับ 3', 'ระดับ 4'];
    const cols = ['var(--l1)', 'var(--l2)', 'var(--l3)', 'var(--l4)'];
    const sorted = rows.slice().sort(function (a, b) {
      const ra = a.n ? (a.d[0] + a.d[1]) / a.n : 0, rb = b.n ? (b.d[0] + b.d[1]) / b.n : 0;
      return rb - ra;
    });
    const tot = [0, 0, 0, 0];
    rows.forEach(r => r.d.forEach((v, i) => tot[i] += v));

    var s = '<div class="dv">';
    sorted.forEach(function (r) {
      const n = r.n || 1;
      const p = r.d.map(v => v / n * 100);
      const risk = p[0] + p[1];
      function seg(i) {
        const w = (p[i] * 2).toFixed(2);
        const tip = '<b>' + esc2(r.key) + ' · ' + esc2(r.label) + '</b>' +
          '<div class="r"><span><i style="background:' + cols[i] + '"></i>' + esc2(names[i]) + '</span>' +

const GORDER = ['อ.1','อ.2','อ.3','ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'];

var ROWS = [];          /* ทุกแถวของทั้งเขต */
var DIST_C = [];        /* ค่าเฉลี่ยรายทักษะของเขต */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const nf = n => Number(n || 0).toLocaleString('th-TH');
const gi = g => { const i = GORDER.indexOf(ABBR_G[g] || g); return i < 0 ? 99 : i; };

function jsonp(params, cb){
  const name = 'cb_' + Math.random().toString(36).slice(2);
  const s = document.createElement('script');
  const t = setTimeout(function(){ cleanup(); cb({ ok:false, message:'หมดเวลาเชื่อมต่อ' }); }, 40000);
  function cleanup(){ clearTimeout(t); try{ delete window[name]; }catch(e){} s.remove(); }
  window[name] = function(r){ cleanup(); cb(r); };
  s.src = API_URL + '?' + params + '&callback=' + name;
  s.onerror = function(){ cleanup(); cb({ ok:false, message:'เชื่อมต่อไม่สำเร็จ' }); };
  document.body.appendChild(s);
}

/* ค่าเฉลี่ยรายทักษะแบบถ่วงน้ำหนักจำนวนนักเรียน */
function avgC(rows){
  const sum = new Array(8).fill(0); var n = 0;
  rows.forEach(function(r){
    const w = r.nAll || 0; if (!w) return;
    n += w;
    for (var k = 0; k < 8; k++) sum[k] += (r.c[k] || 0) * w;
  });
  return n ? sum.map(v => v / n) : new Array(8).fill(0);
}
const mean8 = a => a.reduce((x, y) => x + y, 0) / 8;
const qOf = v => v >= 3.51 ? 'ดีเยี่ยม' : v >= 2.51 ? 'ดี' : v >= 1.51 ? 'พอใช้' : 'ควรพัฒนา';

/* ---------- ตัวกรอง ---------- */
function fill(sel, items, val){
  sel.innerHTML = items.map(o => '<option value="' + esc(o.v) + '">' + esc(o.t) + '</option>').join('');
  if (val != null) sel.value = val;
}

function setupSchools(){
  const q = new URLSearchParams(location.search);
  const list = SCHOOLS.slice().sort((a, b) => a.name.localeCompare(b.name, 'th'));
  fill($('fSchool'), list.map(s => ({ v: s.code, t: s.name + ' · ' + s.group })));
  const want = q.get('smis');
  if (want && SCHOOLS.some(s => s.code === want)) $('fSchool').value = want;
}

function refreshFilters(){
  const smis = $('fSchool').value;
  const mine = ROWS.filter(r => r.smis === smis);

  const years = [...new Set(mine.map(r => r.year))].sort().reverse();
  const keepY = $('fYear').value;
  fill($('fYear'), years.map(y => ({ v: y, t: y })), years.includes(keepY) ? keepY : years[0]);

  const terms = [...new Set(mine.filter(r => r.year === $('fYear').value).map(r => r.term))].sort();
  const keepT = $('fTerm').value;
  fill($('fTerm'), terms.map(t => ({ v: t, t: 'ภาคเรียนที่ ' + t })), terms.includes(keepT) ? keepT : terms[0]);

  const cur = mine.filter(r => r.year === $('fYear').value && r.term === $('fTerm').value);
  const grades = [...new Set(cur.map(r => r.grade))].sort((a, b) => gi(a) - gi(b));
  const keepG = $('fGrade').value;
  fill($('fGrade'), [{ v: '*', t: 'ทุกระดับชั้น' }].concat(grades.map(g => ({ v: g, t: g }))),
    grades.includes(keepG) ? keepG : '*');

  const rooms = [...new Set(cur.filter(r => $('fGrade').value === '*' || r.grade === $('fGrade').value)
    .map(r => r.room))].sort((a, b) => a - b);
  fill($('fRoom'), [{ v: '*', t: 'ทุกห้อง' }].concat(rooms.map(r => ({ v: r, t: 'ห้องที่ ' + r }))), '*');
}

function picked(){
  const smis = $('fSchool').value;
  return ROWS.filter(r => r.smis === smis
    && r.year === $('fYear').value && r.term === $('fTerm').value
    && ($('fGrade').value === '*' || r.grade === $('fGrade').value)
    && ($('fRoom').value === '*' || String(r.room) === String($('fRoom').value)))
    .sort((a, b) => gi(a.grade) - gi(b.grade) || a.room - b.room);
}

/* ---------- ส่วนประกอบของรายงาน ---------- */
function kpiBlock(row, schoolC){
  const my = mean8(row.c), sc = mean8(schoolC), dt = mean8(DIST_C);
  const dS = my - sc, dD = my - dt;
  const risk = row.dist.reduce((a, d) => a + d[0] + d[1], 0);
  const totalMarks = row.nAll * 8;
  const pct = totalMarks ? Math.round(risk / totalMarks * 100) : 0;
  const sign = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  return '<div class="kpi">' +
    '<div class="k"><div class="t">คะแนนเฉลี่ย 8C ของห้อง</div>' +
      '<div class="v">' + my.toFixed(2) + ' <span style="font-size:.8rem;font-weight:600;color:var(--ink-3)">/ 4.00</span></div>' +
      '<div class="d">ระดับคุณภาพ <b>' + qOf(my) + '</b></div></div>' +
    '<div class="k"><div class="t">เทียบค่าเฉลี่ยโรงเรียน</div>' +
      '<div class="v ' + (dS >= 0 ? 'up' : 'dn') + '">' + sign(dS) + '</div>' +
      '<div class="d">โรงเรียน ' + sc.toFixed(2) + '</div></div>' +
    '<div class="k"><div class="t">เทียบค่าเฉลี่ยเขต</div>' +
      '<div class="v ' + (dD >= 0 ? 'up' : 'dn') + '">' + sign(dD) + '</div>' +
      '<div class="d">เขต ' + dt.toFixed(2) + '</div></div>' +
    '<div class="k"><div class="t">ยังไม่ถึงเกณฑ์ (ระดับ 1–2)</div>' +
      '<div class="v ' + (pct >= 25 ? 'dn' : '') + '">' + pct + '%</div>' +
      '<div class="d">' + nf(risk) + ' จาก ' + nf(totalMarks) + ' รายการประเมิน</div></div>' +
    '</div>';
}

function skillTable(row, schoolC){
  var body = '';
  RUBRIC.forEach(function(r, k){
    const d = row.dist[k], v = row.c[k] || 0;
    const need = d[0] + d[1];
    const pc = row.nAll ? Math.round(need / row.nAll * 100) : 0;
    const gap = v - (DIST_C[k] || 0);
    body += '<tr>' +
      '<td><span class="nm"><i style="background:' + r.color + '"></i>' +
        '<span><b>' + r.key + '</b> ' + esc(r.short) + '</span></span></td>' +
      '<td><b>' + v.toFixed(2) + '</b></td>' +
      '<td class="' + (gap >= 0 ? 'up' : 'dn') + '">' + (gap >= 0 ? '+' : '−') + Math.abs(gap).toFixed(2) + '</td>' +
      '<td>' + nf(d[0]) + '</td><td>' + nf(d[1]) + '</td><td>' + nf(d[2]) + '</td><td>' + nf(d[3]) + '</td>' +
      '<td class="risk ' + (pc >= 30 ? 'hi' : pc >= 15 ? 'mid' : '') + '">' + pc + '%</td>' +
      '</tr>';
  });
  return '<table><thead><tr>' +
    '<th>ทักษะ</th><th>เฉลี่ย</th><th>เทียบเขต</th>' +
    '<th><span class="pill lv1">1</span></th><th><span class="pill lv2">2</span></th>' +
    '<th><span class="pill lv3">3</span></th><th><span class="pill lv4">4</span></th>' +
    '<th>ยังไม่ถึงเกณฑ์</th></tr></thead><tbody>' + body + '</tbody></table>' +
    '<p class="cap" style="margin-top:8px">ตัวเลขในคอลัมน์ 1–4 คือ <b>จำนวนนักเรียน</b> ในแต่ละระดับคุณภาพ ' +
    '(1 ควรพัฒนา · 2 พอใช้ · 3 ดี · 4 ดีเยี่ยม)</p>';
}

function targetBlock(row){
  const list = RUBRIC.map(function(r, k){
    const need = row.dist[k][0] + row.dist[k][1];
    return { r: r, k: k, need: need, pc: row.nAll ? Math.round(need / row.nAll * 100) : 0 };
  }).filter(x => x.need > 0).sort((a, b) => b.need - a.need);

  if (!list.length) {
    return '<div class="empty" style="padding:20px">ไม่มีนักเรียนที่อยู่ในระดับ 1–2 ในห้องนี้ 🎉 ' +
      'ให้เน้นกิจกรรมต่อยอดแทน</div>';
  }
  return '<div class="target">' + list.map(x =>
    '<div class="row"><div class="cnt">' + nf(x.need) + '<small>คน</small></div>' +
    '<div class="who"><b>' + x.r.key + ' ' + esc(x.r.short) + '</b>' +
    '<div>ระดับ 1 ควรพัฒนา ' + nf(row.dist[x.k][0]) + ' คน · ระดับ 2 พอใช้ ' + nf(row.dist[x.k][1]) + ' คน</div></div>' +
    '<div class="pc">' + x.pc + '% ของห้อง</div></div>').join('') + '</div>';
}

function planBlock(row){
  const order = RUBRIC.map((r, k) => ({ r: r, k: k, v: row.c[k] || 0 }))
    .sort((a, b) => a.v - b.v).slice(0, 3);
  return '<div class="plan">' + order.map(function(x){
    const lv = Math.max(1, Math.min(4, Math.floor(x.v)));      /* ระดับที่ห้องทำได้แล้ว */
    const nx = Math.min(4, lv + 1);
    const a = ACT[x.r.key] || { fix: [], ext: [] };
    const useFix = x.v < 3;
    return '<div class="card">' +
      '<div class="hd"><b>' + x.r.key + ' ' + esc(x.r.short) + '</b>' +
        '<span>ค่าเฉลี่ยห้อง ' + x.v.toFixed(2) + ' · อยู่ระดับ ' + lv + ' ' + LEVEL_NAME[lv - 1] + '</span></div>' +
      '<div class="bd">' +
        '<div class="step"><b>ตอนนี้ (ระดับ ' + lv + '):</b> ' + esc(x.r.levels[lv - 1]) + '</div>' +
        (lv < 4 ? '<div class="step" style="border-left-color:var(--ok)"><b>เป้าหมายถัดไป (ระดับ ' + nx + '):</b> ' +
          esc(x.r.levels[nx - 1]) + '</div>' : '') +
        '<ul>' + (useFix ? a.fix : a.ext).map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
        (useFix && a.ext.length ? '<div class="ext"><div class="t">สำหรับนักเรียนที่ผ่านเกณฑ์แล้ว (ระดับ 3–4)</div>' +
          '<ul>' + a.ext.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' : '') +
      '</div></div>';
  }).join('') + '</div>';
}

function sheetOf(row, school, schoolC){
  const items = RUBRIC.map((r, k) => ({ key: r.key, short: r.short, label: r.th,
    v: row.c[k] || 0, extra: ['ยังไม่ถึงเกณฑ์', nf(row.dist[k][0] + row.dist[k][1]) + ' คน'] }));
  const stamp = new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
  return '<div class="sheet">' +
    '<div class="rhead"><div>' +
      '<h2>ใบสรุปผลการประเมินทักษะแห่งศตวรรษที่ 21 (8C) รายห้องเรียน</h2>' +
      '<p class="sub">' + esc(school.name) + ' · ' + esc(school.group) + ' · อำเภอ' + esc(school.amphoe) + '</p>' +
    '</div><div class="org">สพป.อุดรธานี เขต 1<br>ปีการศึกษา ' + esc(row.year) +
      ' ภาคเรียนที่ ' + esc(row.term) + '</div></div>' +

    '<div class="meta">' +
      '<span>ระดับชั้น <b>' + esc(row.grade) + '</b></span>' +
      '<span>ห้องที่ <b>' + esc(row.room) + '</b></span>' +
      '<span>จำนวนนักเรียน <b>' + nf(row.nAll) + '</b> คน</span>' +
      (row.reporter ? '<span>ครูผู้ประเมิน <b>' + esc(row.reporter) + '</b></span>' : '') +
      (row.updated || row.created ? '<span>บันทึกเมื่อ <b>' + esc(row.updated || row.created) + '</b></span>' : '') +
    '</div>' +

    kpiBlock(row, schoolC) +

    '<h3 class="sec"><span class="n">1</span> ภาพรวมทักษะ 8 ด้านของห้อง</h3>' +
    '<p class="cap">ยิ่งกางออกยิ่งดี (เต็ม 4.00) — ด้านที่บุ๋มเข้าหาศูนย์กลางคือด้านที่ต้องเร่งพัฒนาก่อน</p>' +
    '<div class="two"><div>' + CH.radar(items) + '</div><div>' + skillTable(row, schoolC) + '</div></div>' +

    '<h3 class="sec"><span class="n">2</span> บัญชีกลุ่มเป้าหมายซ่อมเสริม</h3>' +
    '<p class="cap">เรียงจากด้านที่มีนักเรียนยังไม่ถึงเกณฑ์มากที่สุด ใช้จัดกลุ่มสอนซ่อมเสริมได้ทันที</p>' +
    targetBlock(row) +

    '<h3 class="sec"><span class="n">3</span> แนวทางพัฒนา 3 ด้านที่ควรเร่งที่สุด</h3>' +
    '<p class="cap">อ้างอิงเกณฑ์รูบริก 4 ระดับ — แสดงระดับที่ห้องอยู่ตอนนี้และเป้าหมายถัดไป ' +
    'พร้อมตัวอย่างกิจกรรมที่ครูปรับใช้ได้</p>' +
    planBlock(row) +

    '<div class="sign">' +
      '<div><div class="ln"></div>(' + esc(row.reporter || '.....................................') + ')<br>ครูประจำชั้น</div>' +
      '<div><div class="ln"></div>(.....................................)<br>ผู้อำนวยการโรงเรียน</div>' +
    '</div>' +

    '<div class="foot"><span>8C SkillTrack · สพป.อุดรธานี เขต 1</span>' +
      '<span>พิมพ์เมื่อ ' + stamp + '</span></div>' +
    '</div>';
}

/* ---------- แสดงผล ---------- */
function render(){
  const smis = $('fSchool').value;
  const school = SCHOOLS.find(s => s.code === smis);
  const mine = ROWS.filter(r => r.smis === smis
    && r.year === $('fYear').value && r.term === $('fTerm').value);
  const schoolC = avgC(mine);
  const rows = picked();

  if (!rows.length) {
    $('sheets').innerHTML = '<div class="empty">ยังไม่มีข้อมูลตามเงื่อนไขที่เลือก</div>';
    $('note').textContent = '';
    return;
  }
  $('note').innerHTML = 'กำลังแสดง <b>' + rows.length + '</b> ห้อง — สั่งพิมพ์ครั้งเดียวได้ทั้งหมด ' +
    '(ขึ้นหน้าใหม่ทุกห้อง) · เลือก "ทุกระดับชั้น" เพื่อพิมพ์ทั้งโรงเรียนในครั้งเดียว';
  $('sheets').innerHTML = rows.map(r => sheetOf(r, school, schoolC)).join('');
  $('sheets').querySelectorAll('.chart').forEach(el => CH.bind(el.parentNode));
}

function boot(){
  if (!API_URL) {
    $('sheets').innerHTML = '<div class="empty">ยังไม่ได้ตั้งค่า API_URL ในไฟล์นี้</div>';
    return;
  }
  setupSchools();
  jsonp('action=area', function(r){
    if (!r || !r.ok) {
      $('sheets').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + esc(r && r.message) + '</div>';
      return;
    }
    ROWS = r.rows || [];
    DIST_C = avgC(ROWS);
    refreshFilters();
    render();
  });
}

$('fSchool').addEventListener('change', function(){ refreshFilters(); render(); });
$('fYear').addEventListener('change', function(){ refreshFilters(); render(); });
$('fTerm').addEventListener('change', function(){ refreshFilters(); render(); });
$('fGrade').addEventListener('change', function(){ refreshFilters(); render(); });
$('fRoom').addEventListener('change', render);
$('btnPrint').addEventListener('click', function(){ window.print(); });
$('btnBack').addEventListener('click', function(){
  location.href = 'school.html?smis=' + encodeURIComponent($('fSchool').value);
});

boot();
</script>
</body>
</html>
